<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    color: rgba(24, 28, 34, .92);
    background: transparent;
    -webkit-user-select: none;
  }
  .stage {
    position: absolute;
    inset: 0;
    padding: 38px 16px 16px;
    overflow: hidden;
    background:
      radial-gradient(circle at 82% 18%, rgba(184, 202, 222, .30), transparent 34%),
      radial-gradient(circle at 12% 88%, rgba(171, 185, 205, .24), transparent 36%),
      linear-gradient(145deg, rgba(248, 250, 252, .38), rgba(215, 222, 232, .24));
  }
  .ambient {
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    filter: blur(18px);
    pointer-events: none;
  }
  .ambient.one { right: -40px; top: 55px; background: rgba(196, 211, 228, .30); }
  .ambient.two { left: -55px; bottom: -25px; background: rgba(177, 189, 207, .25); }
  .glass-window {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 34px 30px 30px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.62);
    border-radius: 30px;
    background: linear-gradient(145deg, rgba(255,255,255,.30), rgba(238,242,247,.16));
    box-shadow: 0 28px 70px rgba(34,42,52,.17), inset 0 1px 0 rgba(255,255,255,.86), inset 0 -1px 0 rgba(255,255,255,.22);
    backdrop-filter: blur(36px) saturate(155%);
    -webkit-backdrop-filter: blur(36px) saturate(155%);
  }
  .glass-window::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,.26), transparent 34%, rgba(205,218,232,.08) 74%, transparent);
  }
  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 27px;
  }
  .power-orb, .action-icon {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.64);
    background: linear-gradient(145deg, rgba(255,255,255,.36), rgba(225,232,240,.18));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .power-orb { width: 54px; height: 54px; border-radius: 18px; }
  .power-orb svg { width: 24px; height: 24px; }
  h1 { margin: 0; font-size: 27px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }
  header p { margin: 5px 0 0; color: rgba(43,50,59,.58); font-size: 14px; }
  button {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px;
    overflow: hidden;
    appearance: none;
    cursor: pointer;
    color: rgba(25,29,35,.90);
    text-align: left;
    border: 1px solid rgba(255,255,255,.60);
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(255,255,255,.31), rgba(226,233,241,.14));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.78), 0 12px 26px rgba(38,46,56,.10);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
    font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
  }
  button::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 21px;
    pointer-events: none;
    background: linear-gradient(125deg, rgba(255,255,255,.38), rgba(255,255,255,.03) 40%, transparent 66%);
  }
  button > * { position: relative; z-index: 1; }
  button:hover {
    transform: translateY(-2px);
    background: linear-gradient(145deg, rgba(255,255,255,.42), rgba(226,233,241,.20));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.92), 0 16px 34px rgba(38,46,56,.15);
  }
  button:active { transform: translateY(0) scale(.99); }
  button:focus-visible { outline: 3px solid rgba(78,113,154,.42); outline-offset: 2px; }
  button svg, .power-orb svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .primary {
    min-height: 92px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, rgba(255,255,255,.40), rgba(216,225,235,.18));
  }
  .primary .action-icon { width: 46px; height: 46px; }
  .primary > svg { margin-left: auto; width: 18px; height: 18px; opacity: .46; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .grid button {
    min-height: 132px;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
  }
  .action-icon { width: 44px; height: 44px; border-radius: 14px; }
  .action-icon svg { width: 21px; height: 21px; }
  .warm .action-icon { color: rgba(142,99,31,.82); }
  .danger .action-icon { color: rgba(160,55,60,.84); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="stage">
  <div class="ambient one"></div>
  <div class="ambient two"></div>
  <section class="glass-window" aria-label="电源快捷按钮">
    <header>
      <div class="power-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M6.3 5.3a8 8 0 1 0 11.4 0"/></svg>
      </div>
      <div><h1>电源快捷按钮</h1><p>轻触一下，控制这台 Mac</p></div>
    </header>

    <button class="primary" data-action="display">
      <span class="action-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
      <span>一键黑屏</span>
      <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <div class="grid">
      <button data-action="lock">
        <span class="action-icon"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span>锁定屏幕</span>
      </button>
      <button data-action="sleep">
        <span class="action-icon"><svg viewBox="0 0 24 24"><path d="M20.8 15.1A8.5 8.5 0 0 1 8.9 3.2 9 9 0 1 0 20.8 15.1Z"/></svg></span><span>进入睡眠</span>
      </button>
      <button class="warm" data-action="restart">
        <span class="action-icon"><svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 1 0-2.4 5.8"/><path d="M20 4v7h-7"/></svg></span><span>重新启动</span>
      </button>
      <button class="danger" data-action="shutdown">
        <span class="action-icon"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M6.3 5.3a8 8 0 1 0 11.4 0"/></svg></span><span>关机</span>
      </button>
    </div>
  </section>
</main>
<script>
  document.querySelectorAll('[data-action]').forEach(button => {
    button.addEventListener('click', () => window.webkit.messageHandlers.power.postMessage(button.dataset.action));
  });
</script>
</body>
</html>
